server:
  port: 8080

spring:
  application:
    name: photobooth-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/photobooth_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  storage:
    upload-dir: uploads
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
